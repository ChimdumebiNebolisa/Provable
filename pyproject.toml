[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provable"
version = "0.1.0"
description = "Provable MVP foundations"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["provable*"]
